# Defaults assume the docker-compose postgres-orders service (host port 5433, since
# postgres-stock already claims the default 5432). Every value is overridable via env var
# for other environments.
spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (below) owns the schema; Hibernate only validates its entity mappings against it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
