# Defaults assume the docker-compose postgres-orders service (host port 5433, since
# postgres-stock already claims the default 5432). Every value is overridable via env var
# for other environments.
spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (below) owns the schema; Hibernate only validates its entity mappings against it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: orders-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.amazingco.core.event

server:
  port: ${SERVER_PORT:8080}
